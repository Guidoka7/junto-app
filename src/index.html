<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5F5F7">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Juntô — controle financeiro individual ou em dupla, com previsão do mês, calendário, desafios de economia e plano de guardar primeiro.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Juntô">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Juntô · Nosso dinheiro, nossa vida</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <link rel="stylesheet" href="css/mobile-compact.css">
</head>
<body data-auth="locked">
  <section id="auth-gate" aria-live="polite"><div class="auth-card"><h1>Juntô</h1><p>Verificando acesso…</p></div></section>
  <div id="authenticated-app" hidden inert>
  <aside class="sidebar" aria-label="Navegação principal">
    <div class="brand" data-brand></div>
    <p class="side-caption">Nosso espaço</p>
    <nav class="nav" id="desktop-nav"></nav>
    <div class="side-note"><div class="mini-flower" aria-hidden="true">✳</div><p>Amor não paga boleto.<br>Mas uma dupla organizada, sim.</p><span>Um combinado de cada vez.</span></div>
    <div class="side-couple" id="side-couple"></div>
  </aside>
  <main class="workspace">
    <div class="mobile-brand"><div class="brand" data-brand></div><div id="mobile-user-switch"></div></div>
    <header class="topbar"><div><p class="top-eyebrow" id="couple-label">Nossa vida, em dia</p><h1 id="main-title">Nosso dinheiro</h1></div><div class="top-tools"><span class="date-label" id="month-label"></span><div id="desktop-user-switch"></div><button class="icon-btn" data-action="notifications" aria-label="Ver notificações" id="notification-button"></button><button class="icon-btn" data-action="settings" aria-label="Ajustes da dupla" id="settings-button"></button></div></header>
    <div class="columns"><section class="app-content" id="app-content" aria-label="Finanças da dupla"></section><aside class="peer-rail" id="peer-rail" aria-label="Simulação do celular da outra pessoa"></aside></div>
    <footer class="app-foot"><span>Juntô · amor, planos e uns boletos no caminho.</span></footer>
  </main>
  <nav class="mobile-nav" id="mobile-nav" aria-label="Navegação pelo celular"></nav>
  </div>
  <div class="toast-zone" id="toast-zone" role="status" aria-live="polite" aria-atomic="false"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-wrap" id="modal-content"></div></dialog>
  <input type="file" id="couple-photo-input" accept="image/*" hidden>
  <script src="js/config.js"></script>
  <script src="js/app.js"></script>

<script src="js/ios-layer.js"></script>
  <script src="js/native.js"></script>
  <script src="js/banking.js"></script>
  <script src="js/cloud.js"></script>
  <script src="js/pwa.js"></script>

</body>
</html>
