name: Verificar Juntô
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Auditar dependências de produção
        run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm test
      - run: npm run test:android-parser
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Capturas visuais premium (modo claro e escuro)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junto-premium-visual-${{ github.run_id }}
          path: test-results/premium-*.png
          if-no-files-found: ignore
          retention-days: 3
