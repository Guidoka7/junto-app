name: Gerar APK Android
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão (ex.: 1.1.1); em branco usa package.json.'
        required: false
        default: ''
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: junto-debug-key-${{ github.repository_id }}-v1
      - name: Definir versão
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo 'Versão inválida.' >&2
            exit 1
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:android-parser
      - run: npm run android:sync
      - name: Testes e APK de desenvolvimento
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Preparar assinatura
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo 'SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'SIGNED=false' >> "$GITHUB_ENV"
          fi
      - name: APK e AAB assinados
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Organizar arquivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Junto-${VERSION_NAME}-teste.apk"
          if [ "$SIGNED" = 'true' ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/Junto-${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "out/Junto-${VERSION_NAME}.aab"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: junto-android-${{ env.VERSION_NAME }}
          path: out/*
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"
