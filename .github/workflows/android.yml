name: Gerar APK Android
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Versão (ex.: 1.1.1); em branco usa package.json.'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  apk:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      # Configuração pública do cliente Supabase. Não são credenciais secretas.
      # Mantidas no workflow para que todo APK gerado na main seja funcional.
      SUPABASE_URL: https://sbquedasoydfsvbarvos.supabase.co
      SUPABASE_PUBLISHABLE_KEY: sb_publishable_hld9OVwKT7nJ0xEzYr71KA_ZE9GAuhp
      JUNTO_APP_URL: https://junto-app-tan.vercel.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Instalar SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'build-tools;35.0.0'
      - uses: actions/cache/restore@v4
        id: debug-key
        with:
          path: ~/.android/debug.keystore
          key: junto-debug-key-${{ github.repository_id }}-v1
      - name: Preparar chave debug persistente
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -noprompt -storetype JKS -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
          echo "JUNTO_DEBUG_KEYSTORE=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
      - uses: actions/cache/save@v4
        if: steps.debug-key.outputs.cache-hit != 'true'
        with:
          path: ~/.android/debug.keystore
          key: junto-debug-key-${{ github.repository_id }}-v1
      - name: Remover candidato e usar a chave canônica do cache
        if: steps.debug-key.outputs.cache-hit != 'true'
        run: rm "$HOME/.android/debug.keystore"
      - uses: actions/cache/restore@v4
        if: steps.debug-key.outputs.cache-hit != 'true'
        with:
          path: ~/.android/debug.keystore
          key: junto-debug-key-${{ github.repository_id }}-v1
          fail-on-cache-miss: true
      - name: Definir versão
        env:
          INPUT_VERSION: ${{ inputs.version_name }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            V="${GITHUB_REF#refs/tags/v}"
          elif [ -n "$INPUT_VERSION" ]; then
            V="$INPUT_VERSION"
          else
            V="$(node -p "require('./package.json').version")"
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo 'Versão inválida.' >&2
            exit 1
          fi
          P="$(node -p "require('./package.json').version")"
          echo "PACKAGE_VERSION=$P" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF" == refs/heads/main ]]; then
            V="${P}-${GITHUB_SHA:0:7}.${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
      - name: Validar configuração pública do Supabase
        run: |
          test -n "$SUPABASE_URL" || { echo "SUPABASE_URL ausente" >&2; exit 1; }
          test -n "$SUPABASE_PUBLISHABLE_KEY" || { echo "SUPABASE_PUBLISHABLE_KEY ausente" >&2; exit 1; }
          case "$SUPABASE_URL" in https://*.supabase.co) ;; *) echo "SUPABASE_URL inválida" >&2; exit 1 ;; esac
          case "$SUPABASE_PUBLISHABLE_KEY" in sb_publishable_*) ;; *) echo "Chave Supabase pública inválida" >&2; exit 1 ;; esac
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run test:android-parser
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Configurar Firebase para o APK (opcional)
        env:
          FIREBASE_GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.FIREBASE_GOOGLE_SERVICES_JSON_BASE64 }}
        shell: bash
        run: |
          # O secret tem prioridade; sem ele, usa o google-services.json versionado do projeto junto-apk.
          if [ -n "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ ! -f android/app/google-services.json ]; then
            echo 'Firebase não configurado: APK segue sem push remoto (sem mudar os avisos existentes).'
            exit 0
          fi
          node -e 'const f=require("./android/app/google-services.json"); if(!f.project_info?.project_id || !f.client?.some(c=>c.client_info?.android_client_info?.package_name==="br.com.junto.app")) { console.error("Firebase Android não pertence ao pacote br.com.junto.app"); process.exit(1); }'
          echo 'JUNTO_PUSH_ENABLED=true' >> "$GITHUB_ENV"
      - run: npm run android:sync
      - name: Testes e APK de desenvolvimento
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verificar APK instalável
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/debug/app-debug.apk > "$RUNNER_TEMP/debug-cert.txt"
          cat "$RUNNER_TEMP/debug-cert.txt"
          CERT_SHA256="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/debug-cert.txt")"
          [[ "$CERT_SHA256" =~ ^[0-9a-f]{64}$ ]]
          echo "DEBUG_CERT_SHA256=$CERT_SHA256" >> "$GITHUB_ENV"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk
      - name: Preparar assinatura
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo 'SIGNED=true' >> "$GITHUB_ENV"
          else
            echo 'SIGNED=false' >> "$GITHUB_ENV"
          fi
      - name: APK e AAB assinados
        if: env.SIGNED == 'true'
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease bundleRelease
      - name: Organizar arquivos
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk "out/Junto-${VERSION_NAME}-teste.apk"
          if [ "${SIGNED:-false}" = 'true' ]; then
            cp android/app/build/outputs/apk/release/app-release.apk "out/Junto-${VERSION_NAME}.apk"
            cp android/app/build/outputs/bundle/release/app-release.aab "out/Junto-${VERSION_NAME}.aab"
          fi
      - name: Metadados do APK de teste
        run: node scripts/apk-metadata.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: junto-android-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: error
          path: out/*
      - name: Publicar Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
      - name: Apagar chave temporária
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

  rolling:
    if: github.ref == 'refs/heads/main'
    needs: apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: junto-android-rolling
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: junto-android-${{ github.run_id }}-${{ github.run_attempt }}
          path: out
      - name: Atualizar entrega automática de teste
        run: node scripts/publish-apk.mjs
        env:
          GH_TOKEN: ${{ github.token }}
