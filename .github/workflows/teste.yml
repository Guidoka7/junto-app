name: CineCode teste
on:
  push:
    branches: [cinecode-midia]
permissions:
  contents: write
jobs:
  teste:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: |
          echo "ok $(date -u) $(nproc) cpus $(free -g | awk '/Mem/{print $2}')GB" > status.txt
          curl -s -o /dev/null -w "commons %{http_code}\n" https://commons.wikimedia.org/w/api.php >> status.txt
          curl -s -o /dev/null -w "hf %{http_code}\n" https://huggingface.co >> status.txt
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add status.txt && git commit -qm "status [skip ci]" && git push -q origin HEAD:cinecode-midia
